apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-api
  namespace: scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanner-api #somecomment
  template:
    metadata:
      labels:
        app: scanner-api
    spec:
      containers:
        - name: api
          image: scanner-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: scanner-api-config
            - secretRef:
                name: scanner-s3
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD