[project]
name = "scanner-data"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
scanner-data = "scanner_data:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
